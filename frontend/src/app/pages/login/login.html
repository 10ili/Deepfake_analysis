<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Вход</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field>
        <mat-label>Логин</mat-label>
        <input matInput formControlName="login" autocomplete="username" />
        @if (form.controls.login.hasError('required')) {
          <mat-error>Введите логин</mat-error>
        }
      </mat-form-field>

      <mat-form-field>
        <mat-label>Пароль</mat-label>
        <input
          matInput
          formControlName="password"
          autocomplete="current-password"
          [type]="hidePassword() ? 'password' : 'text'"
        />
        <button
          matIconButton
          matSuffix
          type="button"
          aria-label="Показать пароль"
          (click)="hidePassword.set(!hidePassword())"
        >
          <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        @if (form.controls.password.hasError('required')) {
          <mat-error>Введите пароль</mat-error>
        } @else if (form.controls.password.hasError('minlength')) {
          <mat-error>Не меньше 6 символов</mat-error>
        }
      </mat-form-field>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button matButton="filled" type="submit" [disabled]="loading()">Войти</button>
    </form>
  </mat-card-content>
</mat-card>
